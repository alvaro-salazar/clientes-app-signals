<header class="d-flex justify-content-between align-items-center p-2 border-bottom">
  <strong>Clientes</strong>
  @if (auth.autenticado()) {
    <span>
      {{ auth.usuario() }}
      @if (auth.esAdmin()) { <span class="badge text-bg-secondary">admin</span> }
      <button class="btn btn-sm btn-outline-secondary ms-2" (click)="auth.salir()">Salir</button>
    </span>
  } @else {
    <button class="btn btn-sm btn-primary" (click)="auth.entrar()">Entrar</button>
  }
</header>

<div class="container mt-4">
  <router-outlet></router-outlet>
</div>
